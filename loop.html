<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Looping Constructs</title>
    </head>
    <body>
        <script>
            console.log("For Loop:");
            for(let i = 1; i <= 10; i++) {
                console.log(i*2);
            }

            console.log("While Loop:");
            let j = 1;
            while(j <= 5) {
                console.log(j);
                j++;
            }

            console.log("Do-While Loop:");
            let k = 1;  
            do {
                console.log(k);
                k++;
            } while(k <= 3);

            console.log("For-in Loop:");
            let person = { id : 1,name: "Alice", age: 30, city: "New York",login :true };
            for(let key in person) {
                console.log(key + ": " + person[key]);
            }

            console.log("For-of Loop:");//show the index
            let colors = ["Red", "Green", "Blue"];
            for(let i = 0; i < colors.length; i++) {
                console.log(i + ": " + colors[i]);
            }

            </script>
    </body>
<html>
