```html
<!DOCTYPE html>
<html>
<head>
<title>Random Ball</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
}

.container{
    width:700px;
    height:400px;
    border:4px solid white;
    position:relative;
    overflow:hidden;
    background-image:url("wall.png");
    background-size:cover;
}

.ball{
    width:40px;
    height:40px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, white, red);
    position:absolute;

    animation: randomMove 3s linear infinite;
}

@keyframes randomMove{

0%{ left:0px; top:0px; }

10%{ left:90%; top:100px; }

20%{ left:20px; top:50px; }

30%{ left:10px; top:80px; } 

40%{ left:100px; top:200px; }

50%{ left:650px; top:300px; }

60%{ left:350px; top:50px; }

70%{ left:100px; top:300px; }

80%{ left:500px; top:200px; }

90%{ left:250px; top:100px; }

100%{ left:50px; top:50px; }

}

</style>
</head>

<body>

<div class="container">
<div class="ball"></div>
</div>

</body>
</html>
