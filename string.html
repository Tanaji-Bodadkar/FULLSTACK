<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Looping Constructs</title>
    </head>
    <body>
        <script>
           let text = "JavaScript"
           let con = "is fun" 
           console.log(text.length) // 10

           console.log(text[0]) // J    
           console.log(text[4]) // S
           console.log(text[9]) // t

            console.log(text.toUpperCase()) // JAVASCRIPT
            console.log(text.toLowerCase()) // javascript

            console.log(text.concat(" ", con)) // JavaScript is fun

            console.log(text.trim()) // JavaScript wheen there are spaces in the beginning and end of the string

             console.log(text.charAt(5)) 
            
             let text1 = "lorem ipsum dolor sit amet tanaji"
             console.log(text1,indexOf("tanaji")) // 27

             let name = "tanaji"
             let age = 30
                console.log("my name is " + name + " and my age is " + age) // my name is tanaji and my age is 30

        </script>
    </body>
